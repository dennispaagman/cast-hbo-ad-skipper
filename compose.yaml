services:
  cast-hbo-ad-skipper:
    build: .
    image: cast-hbo-ad-skipper:latest
    container_name: cast-hbo-ad-skipper
    # Host networking is needed for mDNS discovery of Chromecasts. Without it, set
    # HBO_AD_SKIPPER_DEVICES to the device addresses instead.
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
      # HBO_AD_SKIPPER_DEVICES: 192.168.1.79
      # HBO_AD_SKIPPER_LOG_LEVEL: debug
      # HBO_AD_SKIPPER_DRY_RUN: "true"
